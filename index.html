<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.U.M.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jersey+10&display=swap');
    </style>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="monitor">

        <section class="desktop">
            <section id="icons">
                <div class="icon inactive" id="computerIcon">
                    <img src="./assets/icons/computer.svg" alt="Computer">
                    <p>Mi Computadora</p>
                </div>
                <div class="icon inactive" id="recycleBinIcon">
                    <img src="./assets/icons/trashcan.svg" alt="trashcan">
                    <p>Recycle Bin</p>
                </div>
                <!-- <div class="icon inactive" id="filesIcon">
                    <img src="" alt="files">
                </div> -->
                <div class="icon inactive" id="umailIcon">
                    <img src="./assets/icons/umail.svg" alt="Umail">
                    <p>Umail</p>
                </div>
                <div class="icon inactive" id="workIcon">
                    <img src="./assets/icons/work.svg" alt="Work.exe">
                    <p>Work.exe</p>
                </div>
            </section>

            <section class="window umail bordered hidden">
                <span class="windowBar" id="umailBar">
                    <button class="windowButton btnClose" id="umailClose">X</button>
                    <span class="windowTitle" id="umailTitle">Umail</span>
                </span>
                <section class="windowBody">
                    <aside class="contactsBar">
                        <ul class="contactsList">
                            <li class="contact" id="managerContact">Bobby</li>
                            <li class="contact" id="hackerContact">#%%^*&</li>
                            <li class="contact" id="rogelioContact">Rogelio</li>
                            <li class="contact" id="printerContact">Printer</li>
                        </ul>
                    </aside>
                    <section class="umailChat">
                        <span class="chatTitle">Bobby</span>
                        <article class="umailChatLogs"></article>
                        <ul class="choiceBoxes">
                            <li class="choiceBox" id="mangerChoice">1</li>
                            <li class="choiceBox" id="hackerChoice">2</li>
                            <li class="choiceBox" id="neutralChoice">3</li>
                        </ul>
                    </section>
                </section>
            </section>

            <section class="window checkboxGame bordered">
                <span class="windowBar" id="checkboxGameBar">
                    <button class="windowButton btnClose" id="checkboxGame">X</button>
                    <span class="windowTitle" id="Title">Work</span>
                </span>
                <section class="windowBody">
                    <span class="checkboxGameInfo">Click the Checkboxes!!!</span>
                    <span class="checkboxGameInfo hidden" id="checkboxGameWinInfo">You Clicked the Checkboxes!!!</span>
                    <ul class="checkboxes">
                        <li class="checkbox revBordered"></li>
                        <li class="checkbox revBordered"></li>
                        <li class="checkbox revBordered"></li>

                        <li class="checkbox revBordered"></li>
                        <li class="checkbox revBordered"></li>
                        <li class="checkbox revBordered"></li>

                        <li class="checkbox revBordered"></li>
                        <li class="checkbox revBordered"></li>
                        <li class="checkbox revBordered"></li>
                    </ul>
                    <span id="checkboxGameTimer"></span>
                </section>
            </section>

            <section class="window loadingGame bordered">
                <span class="windowBar" id="loadingGameBar">
                    <button class="windowButton btnClose" id="loadingGame">X</button>
                    <span class="windowTitle" id="progressTitle">Loading...</span>
                </span>
                <span class="loadingText">no progress</span>
                <section class="windowBody">
                    <div class="loadingBar bordered">
                        <div class="loadingProgress">
                            <div class="rightedge"></div>
                        </div>
                    </div>
                </section>
            </section>

        </section>
        <section class="monitorInteractables">
            <section class="monitorDiskDrive bordered"></section>
            <section class="monitorPower">
                <button class="monitorPowerOnBtn bordered"></button>
                <section class="monitorPowerLight on">
                    <div class="monitorPowerInner on"></div>
                </section>
            </section>
        </section>
    </main>
</body>

</html>
